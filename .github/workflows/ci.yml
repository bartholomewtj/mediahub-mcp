name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    # Hosted CI runs on the public repository only.
    if: ${{ !github.event.repository.private }}
    name: pytest (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install
        run: python -m pip install -r requirements.txt pytest pytest-asyncio pyyaml
      - name: Test
        run: python -m pytest -q

  compose:
    if: ${{ !github.event.repository.private }}
    name: compose config (${{ matrix.variant }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        variant: [full, core, full-vpn]
    steps:
      - uses: actions/checkout@v4
      - name: Validate the compose files
        shell: bash
        run: |
          set -euo pipefail
          home="$(mktemp -d)"
          export MEDIAHUB_HOME="$home"
          cp compose/stack.env.example "$home/stack.env"
          : > "$home/secrets.env"
          : > "$home/vpn.env"
          {
            echo
            echo "MEDIA_ROOT=/tmp/media"
            case "${{ matrix.variant }}" in
              full) echo "MEDIAHUB_STACK=full" ;;
              core) echo "MEDIAHUB_STACK=core" ;;
              full-vpn)
                echo "MEDIAHUB_STACK=full"
                echo "MEDIAHUB_VPN=gluetun"
                echo "VPN_SERVICE_PROVIDER=mullvad"
                ;;
            esac
          } >> "$home/stack.env"
          bash compose/mh.sh config --quiet

  shell-syntax:
    if: ${{ !github.event.repository.private }}
    name: bash -n
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax-check every shell script
        run: |
          set -e
          find . -name '*.sh' -not -path './.git/*' -print0 | xargs -0 -n1 bash -n
